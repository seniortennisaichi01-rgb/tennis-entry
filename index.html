.sub{font-size:.8rem;color:rgba(255,255,255,.5);letter-spacing:.15em;font-weight:300;}
main{max-width:960px;margin:0 auto;padding:1.75rem 1.25rem 3rem;}
.notice{background:var(--gold-pale);border:1.5px solid #e8c86a;border-radius:var(--r-lg);padding:1.1rem 1.3rem;margin-bottom:1.5rem;}
.notice-title{font-size:.82rem;font-weight:700;color:#7a5500;margin-bottom:.4rem;}
.notice-body{font-size:.83rem;color:#5a3e00;line-height:1.75;}
.search-wrap{margin-bottom:1.25rem;}
.search-input{width:100%;padding:.85rem 1.2rem;border:2px solid var(--g200);border-radius:40px;font-size:.92rem;font-family:inherit;color:var(--g800);background:var(--white);outline:none;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.06);}

.filter-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.35rem;}
.fchip{padding:.42rem 1rem;border-radius:20px;border:1.5px solid var(--g200);background:var(--white);font-size:.78rem;font-weight:700;color:var(--g600);cursor:pointer;transition:.15s;font-family:inherit;}
.fchip:hover{border-color:var(--blue-l);color:var(--blue);}
.fchip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.pairs{display:flex;flex-direction:column;gap:.65rem;}
.pair-card{background:var(--white);border-radius:var(--r-lg);box-shadow:0 2px 10px rgba(26,42,74,.07);overflow:hidden;border-left:4px solid var(--blue-l);display:flex;align-items:center;padding:.9rem 1.2rem;gap:1.1rem;transition:.15s;}
.pair-card:hover{box-shadow:0 4px 18px rgba(26,42,74,.13);transform:translateX(2px);}
.pair-cat{flex-shrink:0;background:var(--blue-pale);color:#1a3a6a;font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.pair-ids{flex-shrink:0;text-align:right;min-width:50px;}
.pair-ids span{display:block;font-size:.71rem;color:var(--g400);line-height:1.5;}
.pair-names{flex:1;}
.pair-names .p1,.pair-names .p2{font-size:.96rem;font-weight:700;color:var(--navy);line-height:1.45;}
.pair-belong{flex-shrink:0;font-size:.71rem;color:var(--g600);text-align:right;max-width:130px;line-height:1.5;}
.empty{text-align:center;padding:3rem;color:var(--g400);font-size:.88rem;}
footer{text-align:center;font-size:.72rem;color:var(--g400);padding:1.5rem 1rem;border-top:1px solid var(--g200);}
@media(max-width:580px){.pair-belong,.pair-ids{display:none;}}

const CATS=["Ａ女子120歳以上","Ｃ男子130歳以上","Ｂ女子135歳以上","D男子155歳以上","Ｅミックスダブルス140歳以上"];
let activeCat='all',searchQ='';
function init(){
  const row=document.getElementById('filterRow');
  row.innerHTML=[{label:'すべて',val:'all'},...CATS.map(c=>({label:c,val:c}))].map(c=>
    `<button class="fchip${c.val==='all'?' active':''}" onclick="setCat('${c.val.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${c.label}</button>`
  ).join('');
  render();
}
function setCat(c){
  activeCat=c;
  document.querySelectorAll('.fchip').forEach(el=>el.classList.toggle('active',el.textContent.trim()===(c==='all'?'すべて':c)));
  render();
}
function doFilter(){searchQ=document.getElementById('searchInput').value.toLowerCase();render();}
function render(){
  const filtered=PAIRS.filter(p=>{
    if(activeCat!=='all'&&p.cat!==activeCat)return false;
    if(!searchQ)return true;
    return[p.n1,p.n2,p.b1,p.b2,String(p.id1),String(p.id2)].some(v=>v&&v.toLowerCase().includes(searchQ));
  });
  const list=document.getElementById('pairList');
  if(!filtered.length){list.innerHTML='<div class="empty">該当する選手が見つかりません</div>';return;}
  list.innerHTML=filtered.map(p=>`
    <div class="pair-card">
      <span class="pair-cat">${p.cat}</span>
      <div class="pair-ids"><span>${p.id1}</span><span>${p.id2||''}</span></div>
      <div class="pair-names"><div class="p1">${p.n1}</div>${p.n2?'<div class="p2">'+p.n2+'</div>':''}</div>
      <div class="pair-belong"><div>${p.b1||''}</div>${p.b2?'<div>'+p.b2+'</div>':''}</div>
    </div>`).join('');
}
init();
</script>
