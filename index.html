*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

header{background:var(--navy);position:relative;overflow:hidden;}
header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 18px,rgba(255,255,255,.02) 18px,rgba(255,255,255,.02) 20px);}

.search-wrap{margin-bottom:1.25rem;}

.tab-bar{display:flex;gap:.4rem;margin-bottom:1.25rem;border-bottom:2px solid var(--g200);}

.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.pairs{display:flex;flex-direction:column;gap:.65rem;}
.pair-card{background:var(--white);border-radius:var(--r-lg);box-shadow:0 2px 10px rgba(26,42,74,.07);overflow:hidden;border-left:4px solid var(--blue-l);display:flex;align-items:center;padding:.9rem 1.2rem;gap:1.1rem;transition:.15s;}

.pair-belong{flex-shrink:0;font-size:.71rem;color:var(--g600);text-align:right;max-width:130px;line-height:1.5;}
.empty{text-align:center;padding:3rem;color:var(--g400);font-size:.88rem;}
footer{text-align:center;font-size:.72rem;color:var(--g400);padding:1.5rem 1rem;border-top:1px solid var(--g200);}
@media(max-width:580px){.pair-belong,.pair-ids{display:none;}}

ｽ＞","id2":28407,"n2":"中野 弘文","b2":""},{"tab":"男子","cat":"男子155歳以上","id1":21473,"n1":"柳沼 平八","b1":"<青山ｸﾗﾌﾞ>","id2":20968,"n2":"古庄 敏朗","b2":"<東海郵政>"},{"tab":"男子","cat":"男子155歳以上","id1":26418,"n1":"伊藤 立三","b1":"","id2":26417,"n2":"小林 富夫","b2":""},{"tab":"男子","cat":"男子155歳以上","id1":28607,"n1":"伊藤 壽記","b1":"","id2":29703,"n2":"檜垣 一喜","b2":""},{"tab":"男子","cat":"男子155歳以上","id1":19691,"n1":"山西 卓治","b1":"<ﾊﾟｼﾌｨｯｸ>","id2":20153,"n2":"藤田 和由","b2":"<豊橋ｽｰﾊﾟｰﾋｯﾄ>"},{"tab":"男子","cat":"男子155歳以上","id1":28133,"n1":"庄原 哲夫","b1":"<尾張旭市ﾃﾆｽ連盟>","id2":3959,"n2":"小林 廉四郎","b2":"<ゆうゆうクラブ>"},{"tab":"男子","cat":"男子155歳以上","id1":28524,"n1":"辻  秀樹","b1":"","id2":28498,"n2":"奥村 幸年","b2":""},{"tab":"男子","cat":"男子155歳以上","id1":21991,"n1":"丹羽 春穂","b1":"<東海市>","id2":23688,"n2":"吉川 髙志","b2":"<諸の木ＴＣ>"}];
const TABS=["女子","男子"];
let activeTab=TABS[0]||'';
let activeCat='all',searchQ='';

function init(){
  // タブが2つ以上ある場合のみタブバーを表示
  const tb=document.getElementById('tabBar');
  if(TABS.length>1){
    tb.innerHTML=TABS.map(t=>
      `<button class="tab-btn${t===activeTab?' active':''}" data-tab="${t}" onclick="setTab(this.dataset.tab)">${t}</button>`
    ).join('');
  }else{
    tb.style.display='none';
  }
  buildCatChips();
  render();
}

function buildCatChips(){
  // 現在のタブに属するカテゴリだけをチップに表示
  const catsInTab=[...new Set(PAIRS.filter(p=>TABS.length<=1||p.tab===activeTab).map(p=>p.cat).filter(Boolean))];
  const row=document.getElementById('filterRow');
  row.innerHTML=[{label:'すべて',val:'all'},...catsInTab.map(c=>({label:c,val:c}))].map(c=>
    `<button class="fchip${c.val==='all'?' active':''}" data-cat="${c.val}" onclick="setCat(this.dataset.cat)">${c.label}</button>`
  ).join('');
}

function setTab(t){
  activeTab=t;
  activeCat='all';
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  buildCatChips();
  render();
}

function setCat(c){
  activeCat=c;
  document.querySelectorAll('.fchip').forEach(el=>el.classList.toggle('active',el.dataset.cat===c));
  render();
}

function doFilter(){searchQ=document.getElementById('searchInput').value.toLowerCase();render();}

function render(){
  const filtered=PAIRS.filter(p=>{
    if(TABS.length>1&&p.tab!==activeTab)return false;
    if(activeCat!=='all'&&p.cat!==activeCat)return false;
    if(!searchQ)return true;
    return[p.n1,p.n2,p.b1,p.b2,String(p.id1),String(p.id2)].some(v=>v&&v.toLowerCase().includes(searchQ));
  });
  const list=document.getElementById('pairList');
  if(!filtered.length){list.innerHTML='<div class="empty">該当する選手が見つかりません</div>';return;}
  list.innerHTML=filtered.map(p=>`
    <div class="pair-card">
      <span class="pair-cat">${p.cat}</span>
      <div class="pair-ids"><span>${p.id1}</span><span>${p.id2||''}</span></div>
      <div class="pair-names"><div class="p1">${p.n1}</div>${p.n2?'<div class="p2">'+p.n2+'</div>':''}</div>
      <div class="pair-belong"><div>${p.b1||''}</div>${p.b2?'<div>'+p.b2+'</div>':''}</div>
    </div>`).join('');
}
init();
</script>
